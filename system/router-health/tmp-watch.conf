# tmpfs /tmp watch thresholds (kB).  /tmp is capped at 48 MiB by /etc/init.d/tmpfs-cap.
# WARN  = 24 MB  (50% of the cap)  -> something is accumulating
# CRIT  = 40 MB  (83% of the cap)  -> close to ENOSPC, which breaks config generation
# GROW  = 4 MB growth between checks (i.e. ~1 MB/10min) while already above 20 MB
# PURGE = 1     -> auto-reclaim whitelisted stale files in /tmp root
# PURGE_AGE_MIN -> only delete files untouched for this many minutes (6h)
TMP_WARN_KB=24576
TMP_CRIT_KB=40960
TMP_GROWTH_KB=4096
TMP_NOTICE_KB=20480
TMP_PURGE=1
TMP_PURGE_AGE_MIN=360
