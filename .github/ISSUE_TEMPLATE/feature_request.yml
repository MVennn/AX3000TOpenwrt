name: 功能建议
description: 想要新的守护项、恢复手段或更省事的运维方式
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前可以先翻翻已有的 Issue，并确认 [docs/OPERATIONS.md](https://github.com/MVennn/AX3000TOpenwrt/blob/main/docs/OPERATIONS.md)
        与 [docs/PITFALLS.md](https://github.com/MVennn/AX3000TOpenwrt/blob/main/docs/PITFALLS.md)
        里没有现成的做法。

  - type: textarea
    id: problem
    attributes:
      label: 什么场景不顺手
      description: |
        先说场景再说想法——「在什么情况下，现在要怎么做，哪一步多余或容易漏」。
        场景越具体，越容易判断该不该做、怎么做。
      placeholder: |
        例：
        每次升级固件前都要手动停 guardian、备份、再恢复 crontab，
        步骤多且容易漏掉其中一步。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的效果（可选）
      description: 希望脚本自动判断、加一个开关，还是只补文档说明？
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      description: 本仓只管路由器本体这一层。
      options:
        - label: 这个建议只涉及路由器本体的运维（守护 / 恢复 / 开机自启 / 基线），不涉及代理内核、订阅、分流规则、LuCI 或 AI 接入。
          required: true
        - label: 我知悉新增或改动脚本需要在真机上验证，愿意在自己的设备上配合验证。
          required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
      description: 你现在的做法、相关命令、设备状态截图等
    validations:
      required: false
