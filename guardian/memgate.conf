# U13-guard : memory gate for the ShellCrash legacy watchdog.
#
# Do NOT start (or restart) CrashCore while the system has no memory headroom.
# The value is compared against MemAvailable from /proc/meminfo (kB).
#   block the launch when  MemAvailable < MEM_GATE_KB
#
# Why (measured on this router, 2026-10-20):
#   MemTotal                = 239024 kB
#   normal running          = 73000 - 82000 kB  (CrashCore alive)
#   during the OOM episodes = 31972 kB and 14676 kB
#   /tmp is a RAM tmpfs, cap = 119512 kB, the core payload is ~57 MB
# 32768 kB (32 MB) sits above every observed crash value and far below the
# normal floor, so the gate fires exactly in the states that produced the
# OOM -> relaunch -> OOM -> watchdog-reset loop.
#
# Raise the value to be more strict, lower it to be more permissive.
MEM_GATE_KB=32768
MEMGATE_FORCE_AFTER=5
