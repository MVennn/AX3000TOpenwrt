## This file contains files and directories that should
## be preserved during an upgrade.

# /etc/example.conf
# /etc/openvpn/


## Argon theme: third-party, not present in ANY official OpenWrt feed.
## Its files must be preserved across sysupgrade or the UI loses its theme.
/www/luci-static/argon/
/www/luci-static/resources/menu-argon.js
/www/luci-static/resources/menu-argon.js.o
/usr/lib/lua/luci/view/themes/argon/
/usr/libexec/argon/
/usr/share/rpcd/acl.d/luci-theme-argon.json

## ShellCrash proxy stack (installed manually, outside apk).
