/etc/ShellCrash/jsons
/etc/ShellCrash/lang
/etc/ShellCrash/libs
/etc/ShellCrash/menu.sh
/etc/ShellCrash/menus
/etc/ShellCrash/providers
/etc/ShellCrash/rules
/etc/ShellCrash/ruleset
/etc/ShellCrash/servers.list
/etc/ShellCrash/start.sh
/etc/ShellCrash/starts
/etc/ShellCrash/task
/etc/ShellCrash/tools
/etc/ShellCrash/ui
