## This file contains files and directories that should
## be preserved during an upgrade.

# /etc/example.conf
# /etc/openvpn/


## Argon theme: third-party, not present in ANY official OpenWrt feed.
## Its files must be preserved across sysupgrade or the UI loses its theme.
/www/luci-static/argon/
/www/luci-static/resources/menu-argon.js
/www/luci-static/resources/menu-argon.js.o
/usr/lib/lua/luci/view/themes/argon/
/usr/libexec/argon/
/usr/share/rpcd/acl.d/luci-theme-argon.json

## Landing page: /www/index.html belongs to the luci-base package and is
## replaced by the stock LuCI redirect on every luci reinstall. Preserving it
## across sysupgrade keeps https://<ip>/ landing on /modern/.
/www/index.html

## ShellCrash proxy stack (installed manually, outside apk).
## The 32MB CrashCore.raw and the redundant meta-backup/ are deliberately
## NOT backed up: they are re-downloadable and would blow the overlay budget.
/etc/ShellCrash/cache.db
/etc/ShellCrash/cn_ip.txt
/etc/ShellCrash/cn_ipv6.txt
/etc/ShellCrash/config.yaml
/etc/ShellCrash/configs
/etc/ShellCrash/init.sh
/etc/ShellCrash/jsons
/etc/ShellCrash/lang
/etc/ShellCrash/libs
/etc/ShellCrash/menu.sh
/etc/ShellCrash/menus
/etc/ShellCrash/providers
/etc/ShellCrash/rules
/etc/ShellCrash/ruleset
/etc/ShellCrash/servers.list
/etc/ShellCrash/start.sh
/etc/ShellCrash/starts
/etc/ShellCrash/task
/etc/ShellCrash/tools
/etc/ShellCrash/ui
/etc/ShellCrash/version
/etc/ShellCrash/yamls
/etc/init.d/shellcrash
/etc/rc.d/S99shellcrash

## Top-level helpers written by this repo / the ops toolkit. Without them a
## flash keeps the cron lines that call them and loses the scripts, so the
## watchdog stops silently (2026-11-14 keepaudit on the router listed all of
## these as "not in keep-list").
/etc/ShellCrash/guardian.sh
# OOM 拉起前的内存闸门：guardian.sh(check) 与 starts/start_legacy_wd.sh 都调用；
# 漏掉会让刷机后两个调用方 fail-open（失去内存保护）。落点见 docs/DEPLOY.md。
/etc/ShellCrash/memgate.sh
/etc/ShellCrash/dest-guard.sh
/etc/ShellCrash/health-snapshot.sh
/etc/ShellCrash/bulk-guard.sh
/etc/ShellCrash/traffic-stats.sh
/etc/ShellCrash/stats
/etc/ShellCrash/rules-porn.sh

## Self-built nft tables (loaded by rc.local; copies live in system/).
## Without them a sysupgrade wipes: DNS hijack (googleroute), QUIC block
## (quicguard), Google CN-edge redirect (googlecn) and the 7890 closure (mixedport).
/etc/quicguard.nft
/etc/quicguard-sync.sh
/etc/googlecn.nft
/etc/googleroute.nft
/etc/mixedport.nft

## Router-health runtime (scripts live in system/router-health/; logs are device state).
/etc/router-health/

## cron table -- ShellCrash set_cron.sh rewrites the whole file, keep it across flashes.
/etc/crontabs/root
